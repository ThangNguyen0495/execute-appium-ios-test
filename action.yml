name: 'IOS Appium Workflow Action'
description: 'Custom GitHub Action to run Appium tests with Maven.'
inputs:
  java_version:
    description: 'The version of Java to install.'
    required: false
    default: '22'

  test_name:
    description: 'The name of the test suite.'
    required: true
  
  env_file_path:
    description: 'The path of the environment configuration'
    required: true

  scripts:
    description: 'The maven commands to execute the test.'
    required: true

runs:
  using: 'composite'
  steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Check bash scripts
      run: |
        SIMULATOR_NAME="iPhone 15"
        SIMULATOR_OS=17.5
        chmod +x ./start_appium_env.sh
        ./start_appium_env.sh "$SIMULATOR_NAME" "$SIMULATOR_OS" "${{ inputs.java_version }}"
    
        DEVICE_UDID=$(xcrun simctl list devices | grep "(Booted)" | awk -F '[()]' '{print $2}' | head -n1)
        echo "DEVICE_UDID=$DEVICE_UDID" >> $GITHUB_ENV
    
        JAVA_PATH="$HOME/.sdkman/candidates/java/${{ inputs.java_version }}-open"
        echo "JAVA_HOME=$JAVA_PATH" >> $GITHUB_ENV
        echo "PATH=$JAVA_PATH/bin:$PATH" >> $GITHUB_ENV
      shell: bash

    - name: Install dependencies
      run: |
        mvn install -DskipTests
      shell: bash

    - name: Run Tests
      run: |
        echo "iosSimulatorUdid=$DEVICE_UDID" > ${{ inputs.env_file_path }}
        eval "${{ inputs.scripts }}" | tee terminal_log.txt
      shell: bash

    - name: Upload Test Report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: Test Reports - ${{ inputs.test_name }}
        path: |
          **/BufferLog.log
          **/ExtentReport.html
